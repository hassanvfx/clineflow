[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "clineflow-mcp"
version = "0.1.7"
description = "Local stdio orchestration for ClineFlow projects"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["mcp==1.29.1", "bleach==6.2.0", "markdown-it-py==4.0.0", "PyYAML==6.0.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
clineflow-mcp = "clineflow_mcp.cli:main"
clineflow-mcp-server = "clineflow_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clineflow_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/clineflow_mcp/dashboard_runtime/component-manifest" = "clineflow_mcp/dashboard_runtime/component-manifest"
"src/clineflow_mcp/dashboard_runtime/engine.py.lock" = "clineflow_mcp/dashboard_runtime/engine.py.lock"
"src/clineflow_mcp/dashboard_runtime/THIRD_PARTY_LICENSES.md" = "clineflow_mcp/dashboard_runtime/THIRD_PARTY_LICENSES.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
