name: Test ClineFlow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      
      - name: Run test suite
        run: ./tests/certify-release.sh

      - name: Require release bump for managed pull-request changes
        if: github.event_name == 'pull_request'
        run: ./template/.clineflow/bin/validate-release --against "${{ github.event.pull_request.base.sha }}"

      - name: Require synchronized knowledge for pull-request changes
        if: github.event_name == 'pull_request'
        run: ./template/.clineflow/bin/validate-knowledge-sync --against "${{ github.event.pull_request.base.sha }}"
      
      - name: Display test results
        if: always()
        run: |
          echo "Test suite completed"
          echo "Check the job logs above for detailed results"

  windows-lifecycle-smoke:
    runs-on: windows-latest

    steps:
      - name: Checkout code with release byte normalization
        uses: actions/checkout@v5

      - name: Install through Git Bash
        shell: bash
        run: |
          workspace_dir=$(cygpath -u "$GITHUB_WORKSPACE")
          smoke_dir=$(cygpath -u "$RUNNER_TEMP")/clineflow-windows-smoke
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          export CLINEFLOW_BASE_URL="file:///$(cygpath -m "$GITHUB_WORKSPACE")/template"
          bash "$workspace_dir/template/.clineflow/bin/install" --yes
          ./.clineflow/bin/doctor
          printf 'CLINEFLOW_SMOKE_DIR=%s\n' "$(cygpath -w "$smoke_dir")" >> "$GITHUB_ENV"

      - name: Exercise the native PowerShell update wrapper
        shell: pwsh
        run: |
          Set-Location "$env:CLINEFLOW_SMOKE_DIR"
          $templatePath = (Resolve-Path "$env:GITHUB_WORKSPACE/template").Path -replace '\\', '/'
          $workspaceUri = ('file:///' + $templatePath.TrimStart('/')).TrimEnd('/')
          $env:CLINEFLOW_BASE_URL = $workspaceUri
          & ./.clineflow/bin/update.ps1 -DryRun
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exercise transactional removal through Git Bash
        shell: bash
        run: |
          cd "$(cygpath -u "$CLINEFLOW_SMOKE_DIR")"
          ./.clineflow/bin/uninstall --yes
          test ! -e .clineflow
          test -d knowledge
