name: Test ClineFlow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run test suite
        run: ./tests/test-installation-flow.sh
      
      - name: Display test results
        if: always()
        run: |
          echo "Test suite completed"
          echo "Check the job logs above for detailed results"
