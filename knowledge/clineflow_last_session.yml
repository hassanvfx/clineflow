version: 1
updated_at: 2026-09-03T18:09:03Z
latest_change: Repaired numeric ordering of date-based updater versions so multi-digit patch upgrades do not trip the downgrade safeguard.
specification_summary:
  - OKF-era installations from 2026.08.15.0 onward update through one manifest-driven, rollback-safe entrypoint.
  - “Please update ClineFlow” authorizes an agent to consult the repository and execute the updater with --yes.
  - Journal, documentation, and knowledge-base changes must reconcile all five ledgers, the active journal, and the knowledge log for every supported agent.
  - The Knowledge Visor stays inert until explicit invocation, then generates self-contained HTML and matching structured snapshots within isolated paths.
  - A Project Story derives project evolution, what matters now, urgency, next action, and selected milestones from source-linked facts.
  - The report progresses from executive context through trajectory, decisions, proof, and canonical source inspection.
  - Every run preserves snapshot.json and observations.json and embeds exact copies for file-protocol viewing; the deterministic observe stage can later be replaced by a CLI/LLM command.
  - YAML ledgers render as structured guided sections with diagnostics and non-mutating normalized repair output.
  - Timeline aliases normalize into canonical report facts while retaining raw provenance; structured evidence remains readable in the explorer and proof surfaces.
  - Time Spine rows lead with a concise title and reveal full narrative notes only on request.
  - Prose statements with colon punctuation are quoted as YAML scalars so they remain narrative facts rather than unintended mappings.
  - The dashboard uses ClineFlow-inspired navy and blue visual tokens, lower-radius geometry, and editorial hierarchy without copying hosted site assets or code.
  - The report presents immediate context, Recent Story, full chronology, proof, and sources in reading order without a chapter-navigation component.
  - The formal presentation JSON is embedded alongside facts and observations; it is the only data model consumed by the browser renderer.
  - Source edit requests persist only in browser localStorage, create copyable agent prompts, and require report regeneration after real edits.
  - knowledge/dashboard/settings.json controls retention: default three reports, a positive explicit limit, or null for unlimited history.
  - Current Agentic Loop summarizes aim, decision boundary, action, and proof from active goals, specification, session, and verification ledgers.
  - The updater compares all four date-based release-version segments numerically and rejects malformed recognized release versions before mutation.
verification_summary:
  - The single lifecycle gate passes fresh installation, historical migrations, transactional removal, rollback, release-contract rejection cases, OKF validation, and diff checks.
  - Native Windows install, PowerShell update, doctor, and removal smoke coverage is configured in CI and awaits its first hosted run.
  - The complete lifecycle certification passes, including the knowledge-sync working-tree, staged, base-reference, missing-context, timestamp-mismatch, code-only, and legacy-journal scenarios.
  - Pull-request CI and the release contract require base-reference knowledge synchronization.
  - Source-repository agent instructions now resolve guides and validators through template/.clineflow, while installed instructions retain .clineflow paths.
  - Dashboard boundary tests pass for dormancy, decline, activation, offline reuse, rollback, export, and uninstall preservation.
  - The dashboard regression suite passes first activation with `--yes` and no explicit subcommand.
  - Focused output checks confirm the visible asset panel is absent while report manifests retain complete provenance.
  - Complete lifecycle certification passes for release 2026.09.03.4 after the default-command repair.
  - Dashboard tests pass Project Story rendering, JSON binding, source-id validation, and removal of the unused graph asset.
  - The updater rollback restored the reported mixed installation after the portability failure.
  - The macOS line-one regression and complete lifecycle certification pass after the portable prefix fix.
  - Release validation rejects canonical update guidance that omits the remote bootstrap or permits a stale local updater first.
  - Dashboard boundary tests pass independent collect, observe, and render stages with source-bound observation validation, embedded JSON equality, structured evidence/timeline normalization, and compact Time Spine regressions.
  - Migration tests prove a `.5` installation updates to a two-digit patch release while a `.10` to `.5` target remains a byte-identical rejection; complete lifecycle certification passes for release 2026.09.03.13.
goals_summary:
  - Future installation-affecting features must update the release manifest and prove their migration decision.
  - Keep every supported agent's commit workflow synchronized through the canonical shared rules template.
next_recommended_step: Publish release 2026.09.03.13, then rerun the authoritative remote updater in the affected downstream project.
