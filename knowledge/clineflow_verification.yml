version: 1
updated_at: 2026-09-03T23:16:14Z
acceptance_criteria:
  - Fresh installation creates the five ClineFlow master indexes and the methodology manual when absent.
  - Shared agent instructions require index-first durable development work.
  - Fresh non-Git installation initializes a usable work tree and doctor passes without a commit, remote, or local identity.
  - README and installed methodology present the canonical agentic installation prompt.
  - The restored remote update command migrates every supported OKF-era layout transactionally.
  - Failed updates restore the prior usable installation and retain recovery evidence.
  - “Please update ClineFlow” directs agents to current repository instructions and authorized non-interactive execution.
  - Canonical agent guidance includes “Please commit,” preview-before-removal, and explicit Knowledge Visor prompts.
  - The README links to focused installation, self-documentation, OKF, and Knowledge Visor guides plus the local Vimeo tutorial preview.
  - Release validation enforces manifest, version, payload, and migration consistency.
  - The lifecycle certification gate proves install, update, and uninstall behavior and cannot omit removal safety while passing release validation.
  - Removal rejects unsafe ownership paths and malformed markers before mutation and restores the prior state after injected failure or termination.
  - Journal, documentation, and knowledge-base changes fail unless all five ledgers, the active journal, and knowledge/log.md are changed together.
  - Working-tree, staged, and base-reference synchronization modes enforce shared timestamps, active-journal references, a current timeline event, and a current log date.
  - Fresh installs and supported updates put the same synchronization rules in every managed agent configuration without replacing user-authored instructions.
  - Release validation rejects CI configurations that omit base-reference knowledge synchronization for pull requests.
  - Release-contract tests reject missing source-repository guide or validator paths and drift in the legacy Cline compatibility template.
  - Dashboard tests prove dormant installation, approval gating, exact activated boundaries, transactional rollback, offline reuse, self-contained HTML/JSON equality, sanitized export, and report-preserving removal.
  - Dashboard tests prove first activation with `--yes` and no explicit subcommand reaches the generate parser and produces a report.
  - Dashboard regressions require a source-bound Project Story, complete validated story JSON, selected milestones, and removal of the former graph engine.
  - Dashboard output exposes the five audience-aware story chapters, omits the visible asset panel, and retains complete asset provenance in manifest.json.
  - Dashboard tests assert independent facts, observations, and render commands; exact embedded/adjacent JSON equality; observation source-hash binding; and executive, manager, and engineer narratives.
  - Knowledge Explorer tests require structured YAML facts, normalized repair output, guided/source/JSON controls, and progressive ledger and journal filters.
  - Dashboard tests prove structured evidence has a readable label and details, structured observation text selects a named statement, and timeline aliases produce canonical time/type/summary/reference facts.
  - Time Spine tests prove a long event narrative never becomes a lane label, derives a concise title, preserves the complete note, and offers expandable disclosure.
  - Migration tests reproduce and pass a valid managed agent block beginning on line one under macOS-compatible shell utilities.
  - Release validation requires canonical agent instructions to name the permanent remote bootstrap and prohibit running local updater copies first.
  - Dashboard fixtures render comprehensive, minimal, and empty facts through observation and render stages with exact embedded presentation JSON and honest empty-state guidance.
  - Dashboard tests prove reports expose no source-edit or browser-storage workflow and that prepared titles, summaries, and expandable details remain self-contained.
  - Dashboard retention tests cover default three-run pruning, configured limits, unlimited history, and the ignored dashboard settings boundary.
  - Dashboard output exposes a Current Agentic Loop backed by goal, specification, session, and verification facts without browser-time source access.
  - Migration tests prove numeric ordering across date-based release segments, including `.5` to a two-digit patch upgrade and `.10` to `.5` downgrade rejection before mutation.
  - Dashboard fixtures prove Project Pulse renders committed change and footprint context, while delivery scenarios validate inputs, calculate totals outside the browser, render missing-estimate guidance, and omit estimate data from sanitized exports.
  - Fresh installation proves the Claude `/update-clineflow` command is present; release validation rejects update rules that allow an unexecuted release check to be reported as current.
  - Dashboard title normalization removes ISO timestamps and source-path parentheticals before constructing a concise visual headline.
  - Managed agent guidance requires the dashboard observation pipeline for natural-language requests and preserves direct CLI generation as the no-insights fallback.
  - Release validation requires the README and lifecycle guide to expose the old-install rescue path and the complete non-interactive remote-bootstrap command.
  - CITATION.cff parses as Citation File Format 1.2.0 metadata with the confirmed author, MIT license, canonical repository URL, and current date-based release version.
regression_checks:
  - Existing installation, ownership, prerequisite, and validator tests remain green.
  - Knowledge, legacy journals, authored documentation, and retired reference artifacts remain unchanged during updates.
  - Edited agent files retain user text during uninstall; exact managed-only files are removed.
  - Code-only changes do not trigger the knowledge synchronization gate.
  - Legacy docs/journals/ edits are rejected.
  - Existing lifecycle, doctor, validation, update, and certification flows pass without activating the optional dashboard.
  - Explicit dashboard subcommands continue to work after default-command forwarding is added.
  - Responsive behavior stacks executive narrative cards, the Project Story, chapter headings, and source explorer without changing content order.
  - Direct file-protocol reports parse embedded facts and observations without browser fetches, servers, or remote connections.
  - Structured ledger records do not render as JavaScript object coercions or blank timeline summaries.
  - Dense event notes stay collapsed and paragraph-formatted until deliberately expanded.
  - Canonical prose list statements containing colons remain YAML scalars and do not introduce accidental structured values.
  - Provided observations reject missing, malformed, or unlinked Project Story statements.
  - Executive activity output must not report the dashboard run itself as project activity.
  - Visual-system changes preserve self-contained report assets and all dormant/activated dashboard boundary tests.
  - Dashboard tests require immediate Recent Story rendering, whole-story expansion, and absence of decorative navigation and chapter chrome.
  - User text before and after an existing managed agent block remains byte-preserved during refresh.
  - Browser renderer consumes the formal presentation JSON and never serializes a structured record as [object Object].
  - Version-ordering checks reject malformed recognized release versions without weakening manifest checksum verification.
  - Dashboard delivery estimates reject invalid currency, rate, hours, costs, multipliers, unknown sources, and agent-provided calculated totals.
  - Dashboard visual regression coverage keeps Knowledge Explorer source-status indicators compact under narrow fixture viewports.
  - Installation and release-contract tests reject missing lifecycle prompts or removal guidance that bypasses the dry-run preview.
  - Complete lifecycle certification passes for release 2026.09.03.20 with the redesigned documentation and synchronized OKF knowledge state.
  - Release-contract tests reject a missing old-install heading or a rescue command that drops non-interactive authorization.
  - Complete lifecycle certification passes for release 2026.09.03.21 with old-install rescue guidance and migration schema 1.
  - GitHub workflow evidence must show both the Linux certification job and windows-lifecycle-smoke passing before the badge repair is complete.
  - Release-contract tests require explicit LF attributes for managed Markdown, YAML, PowerShell, and the extensionless dashboard manifest.
  - Installation and release-contract tests require PowerShell payloads to exist as regular files without imposing Git Bash executable checks.
  - Uninstall safety tests force the external self-copy path and prove managed runtime removal still preserves project knowledge.
