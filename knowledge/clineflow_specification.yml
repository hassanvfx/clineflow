version: 1
updated_at: 2026-09-03T20:16:12Z
confirmed:
  - ClineFlow stores durable engineering context in its versioned OKF knowledge bundle.
  - Engineering Journals remain the detailed canonical record for substantial work.
  - The five ClineFlow-prefixed YAML files are the required discovery and coordination layer.
  - Fresh installation initializes Git when Git is available and the directory is not already a work tree.
  - ClineFlow provides one stable update entrypoint for every OKF-era installation from 2026.08.15.0 onward.
  - Updates are manifest-driven, transactional, verified, and automatically rolled back on failure.
  - The prompt “Please update ClineFlow” authorizes an agent to read current repository instructions and run the updater non-interactively.
  - The prompt “Please remove ClineFlow” requires a dry-run explanation and explicit confirmation before final removal.
  - The prompt “Please commit” closes the durable loop by synchronizing and validating implementation with project knowledge before committing.
  - The prompt “Please show me the ClineFlow dashboard” explicitly invokes the agent-insights dashboard pipeline while preserving first-use approval.
  - Removal validates trusted ownership and markers before mutation, requires confirmation, preserves user text, and rolls back failures or handled interruptions.
  - Cline, Codex, Claude Code, Cursor, GitHub Copilot, and Windsurf receive one canonical agent-neutral durable knowledge contract.
  - Any Git change set containing a journal, documentation, or knowledge-base edit reconciles all five ledgers, the active Engineering Journal, and knowledge/log.md.
  - All five ledger updated_at values, the active journal generated.at value, and the newest timeline event timestamp match within a synchronized change set.
  - Distribution-checkout agent instructions use template/.clineflow paths, while installed-project instructions use .clineflow paths.
  - The Knowledge Visor is activated only by explicit invocation; reports contain embedded verified assets and a matching clineflow-dashboard/v1 snapshot.json.
  - Dashboard invocation without a subcommand forwards `generate` so its parser defaults exist before engine execution.
  - Dashboard metrics are report-derived Git and knowledge facts; absent provider usage is omitted rather than recorded as unavailable.
  - Dashboard observations include a validated source-bound Project Story with evolution, current importance, urgency, next action, and selected timeline milestones.
  - "The report follows five linked chapters: executive context, manager trajectory, engineering decisions, shared proof, and canonical source exploration."
  - Asset provenance remains structured in report manifests and is not rendered as a standalone dashboard panel.
  - Dashboard collection emits normalized facts without narrative interpretation; a separate replaceable observation stage emits clineflow-dashboard-observations/v1 bound to the facts source hash.
  - Each report stores snapshot.json and observations.json beside index.html and embeds exact inert copies of both so file-protocol viewing performs no fetch.
  - Knowledge Explorer parses YAML with the pinned optional PyYAML dependency and offers guided, JSON, raw-source, diagnostic, and copyable normalized-repair views without modifying canonical files.
  - Dashboard facts normalize flexible timeline aliases into canonical event fields while retaining raw records; structured evidence, goals, and constraints render named statements and readable metadata instead of object coercions.
  - Report timeline events carry a short title, compact kind, and full narrative note; the Time Spine displays the title first and reveals formatted detail only on request.
  - Hero headings remove timestamp/path-only context and split supporting narrative into the prepared summary/detail representation.
  - Dashboard rendering creates clineflow-dashboard-presentation/v1 after facts and observations; the browser consumes the presentation model while adjacent and embedded JSON remain exact copies.
  - Dashboard source records are read-only; the presentation model supplies compact titles, summaries, fields, and expandable detail before browser rendering.
  - Dashboard report retention defaults to three complete runs and can be configured under knowledge/dashboard/settings.json with null representing unlimited history.
  - The Current Agentic Loop derives active goal, current decision/constraint, next deliberate action, and verification state exclusively from canonical report facts and links each step to its ledger source.
  - Agent-rule refresh is portable when the managed block begins on the first line or follows user-authored text.
  - The canonical agent update request invokes the permanent remote bootstrap first and never executes a legacy local updater beforehand.
  - The updater compares valid `YYYY.MM.DD.patch` release versions numerically by all four segments before accepting an upgrade or rejecting a downgrade.
  - Project Pulse derives committed change volume and tracked/knowledge footprint only from normalized Git facts, and labels the current working tree separately.
  - An agent may supply a source-bound `clineflow-dashboard-delivery-estimate/v1` through dashboard insights; the observer validates explicit constants and calculates all scenario time and cost outputs.
  - Delivery scenarios are planning estimates, not labor telemetry, productivity scores, or realized savings; sanitized exports omit estimates and agent metadata.
  - “Please update ClineFlow.” is an execution request: agents run the permanent remote bootstrap before any release check and report the resulting `.clineflow/VERSION` or an exact blocker.
  - An agent handling “Show me the ClineFlow dashboard” collects facts, supplies source-linked observations when grounded, then observes and renders; bare CLI generation stays an explicit no-insights fallback.
  - The public README is installation-first and delegates lifecycle, workflow, OKF, and Knowledge Visor detail to focused Markdown references.
assumptions: []
constraints:
  - ClineFlow-owned runtime files remain under .clineflow/.
  - Knowledge and user-authored documentation are preserved during installation and updates.
  - The durable development methodology is installed in docs/ only when absent.
  - Git initialization never creates a commit, remote, identity, or branch policy.
  - Updates preserve existing knowledge, legacy journals, user-authored documentation, retired reference artifacts, and ambiguous legacy files.
  - Installation-affecting releases must declare and verify whether a schema migration is required.
  - CI and releases must run the single lifecycle certification entrypoint covering installation, update, removal, and durable knowledge.
  - Pull-request CI runs knowledge synchronization against the pull request base revision.
  - Every ledger references the active journal; a timestamp-only goals, specification, or verification edit means the ledger was reviewed with no semantic change.
  - Changes to docs/journals/ are rejected because it is immutable legacy context.
  - The optional dashboard may modify only .clineflow/optional/, knowledge/dashboard/, and its exact repository-local Git exclude marker.
  - Browser-opened reports have no remote runtime dependencies, background process, analytics, iframe, or external connection.
  - The Project Story is derived only from normalized facts and canonical document identifiers; it does not infer contributor productivity or create unsourced claims.
  - Executive activity metrics ignore generated report runs and choose the newest knowledge event or Git commit instead.
  - The report reuses ClineFlow’s public visual principles—deep navy, electric blue, bold editorial hierarchy, and restrained geometry—without copying site media, code, or remote dependencies.
  - The dashboard has no chapter-navigation component; it leads with immediate context, a source-linked Recent Story, a compact Time Spine, and an explicit whole-story expansion.
  - Dashboard retention pruning removes only complete, schema-owned run directories after a successful replacement report; settings and malformed directories remain preserved.
  - A malformed recognized installed or release version aborts before any update mutation.
  - The dashboard does not infer delivery time, cost, model configuration, or counterfactual savings when no explicit agent estimate is supplied.
  - Estimate-free reports omit the Delivery Scenarios surface rather than displaying an inactive planning card.
  - Claude Code receives a fixture-installed `/update-clineflow` project command that performs the same remote-bootstrap workflow.
  - Knowledge Explorer source-status indicators remain compact, non-growing controls and must not distort document headers.
  - Public documentation must not reference a dashboard image unless that local asset exists and has been visually verified.
