version: 1
updated_at: 2026-09-03T20:34:40Z
active_goals:
  - Maintain an installed, agent-operational durable development workflow with synchronized current context.
  - Add a representative fixture-backed Knowledge Visor screenshot when an allowed capture surface is available.
priorities:
  - Prevent journal and documentation changes from leaving any of the five durable ledgers stale.
  - Preserve user-authored project context during every update and migration.
success_measures:
  - Every supported agent receives the same five-ledger commit discipline.
  - Qualifying changes fail validation unless all five ledgers, the active journal, and the knowledge log are synchronized.
  - Pull-request CI validates synchronization against the base revision.
  - All supported historical layouts converge to the current release and pass validation.
  - Release validation rejects unmanaged payload changes and incomplete migration chains.
  - One CI-required command certifies installer, updater, remover, preservation, and rollback behavior.
  - Repository-native agent instructions reference files and validators that exist in the distribution checkout.
  - Dormant ClineFlow performs no optional dashboard installation, network access, caching, report generation, or Git exclusion changes.
  - Activated dashboard reports embed verified assets, expose adjacent structured snapshots, and remain inside their declared optional boundaries.
  - A source-bound Project Story clearly explains evolution, current importance, urgency, and the next deliberate move without a relationship graph.
  - One progressive report communicates current meaning to executives, trajectory to managers, and inspectable decisions and sources to engineers.
  - Every dashboard narrative is a validated, source-bound JSON artifact generated after normalized facts and embedded with those facts for offline local viewing.
  - Structured evidence and timeline records remain readable in dashboard views without requiring teams to flatten their canonical YAML.
  - "Time-first observability remains scannable: short event titles and kinds lead, with full narrative available on demand."
  - The Knowledge Visor visually belongs to ClineFlow through a deep-navy, electric-blue editorial system without introducing browser-time dependencies.
  - A dashboard reader can understand now, recent moments, the full project story, proof, and source records without decorative navigation chrome.
  - Dashboard narrative quality is regression-tested against comprehensive, sparse, and empty normalized knowledge fixtures.
  - Dashboard source records remain read-only, concise, and progressively disclosable without a dashboard edit workflow.
  - The dashboard's first read connects active goal, decision boundary, next action, and verification in a source-linked Current Agentic Loop.
  - Date-based updater releases compare numeric version segments so multi-digit patch upgrades remain valid.
  - Dashboard trajectory makes committed change and tracked knowledge growth inspectable without inferring contributor productivity.
  - Agent-authored delivery scenarios make time-and-cost assumptions explicit, calculated, source-bound, and clearly estimated.
  - ClineFlow update requests execute the permanent remote bootstrap or report a concrete blocker; they never substitute a stale release check.
  - Dashboard headings remain concise even when the only available source is a timestamped narrative event.
  - Natural-language dashboard requests use the source-linked observation pipeline rather than a bare report generation path.
  - New users can understand installation, journals, ledgers, lifecycle prompts, and the optional dashboard from a concise README and focused references.
  - Users with stale installed agent instructions can recover through a prominent, copyable remote-bootstrap command without invoking an old local updater.
  - The public workflow badge reflects a passing Linux and native Windows lifecycle matrix on main.
blocked_goals:
  - The in-app browser security policy blocks local file report capture; the dashboard screenshot requires an allowed capture surface or a user-provided image.
completed_goals:
  - Enforce universal five-ledger synchronization for journal, documentation, and knowledge-base changes.
  - Adopt native OKF journals while preserving legacy journals as read-only context.
  - Encapsulate managed tooling and add ownership-safe support for Cline, Codex, Claude Code, Cursor, Copilot, and Windsurf.
  - Add prerequisite handling and deterministic Git initialization for fresh installations.
  - Add the durable development methodology and master indexes to ClineFlow.
  - Deliver a universal transactional updater for supported OKF-era installations.
  - Deliver the isolated, time-first ClineFlow Knowledge Visor.
  - Restore portable transactional updates for mixed schema-0 installations on macOS.
