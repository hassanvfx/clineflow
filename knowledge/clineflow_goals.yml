version: 1
updated_at: 2026-09-03T10:12:33Z
active_goals:
  - Maintain an installed, agent-operational durable development workflow with synchronized current context.
priorities:
  - Prevent journal and documentation changes from leaving any of the five durable ledgers stale.
  - Preserve user-authored project context during every update and migration.
success_measures:
  - Every supported agent receives the same five-ledger commit discipline.
  - Qualifying changes fail validation unless all five ledgers, the active journal, and the knowledge log are synchronized.
  - Pull-request CI validates synchronization against the base revision.
  - All supported historical layouts converge to the current release and pass validation.
  - Release validation rejects unmanaged payload changes and incomplete migration chains.
  - One CI-required command certifies installer, updater, remover, preservation, and rollback behavior.
  - Repository-native agent instructions reference files and validators that exist in the distribution checkout.
  - Dormant ClineFlow performs no optional dashboard installation, network access, caching, report generation, or Git exclusion changes.
  - Activated dashboard reports embed verified assets, expose adjacent structured snapshots, and remain inside their declared optional boundaries.
blocked_goals: []
completed_goals:
  - Enforce universal five-ledger synchronization for journal, documentation, and knowledge-base changes.
  - Adopt native OKF journals while preserving legacy journals as read-only context.
  - Encapsulate managed tooling and add ownership-safe support for Cline, Codex, Claude Code, Cursor, Copilot, and Windsurf.
  - Add prerequisite handling and deterministic Git initialization for fresh installations.
  - Add the durable development methodology and master indexes to ClineFlow.
  - Deliver a universal transactional updater for supported OKF-era installations.
  - Deliver the isolated, time-first ClineFlow Knowledge Visor.
  - Restore portable transactional updates for mixed schema-0 installations on macOS.
